[project]
name = "labagent-backend"
version = "0.1.0"
description = "LabAgent 后端：面向高校实验教学场景的智能学习与教学辅助 Agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.12",
    "minio>=7.2.0",
    "langgraph>=0.2.0,<1.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain>=0.3.0,<1.0",
    "langchain-core>=0.3.0,<1.0",
    "langchain-ollama>=0.2.0,<1.0",
    "ollama>=0.6.0,<1.0",
    "langchain-openai>=0.2.0,<1.0",
    "langchain-postgres>=0.0.12,<0.1",
    "langchain-text-splitters>=0.3.0,<1.0",
    "langchain-community>=0.3.0,<1.0",
    "pypdf>=5.0.0",
    "tiktoken>=0.7.0",
    "psycopg[binary,pool]>=3.2.0",
    "httpx>=0.27.0",
    "rank-bm25>=0.2.2",
    "arq>=0.26.0,<1.0",
    "skills-ref>=0.1.1,<0.2",
]

[dependency-groups]
dev = [
    "litellm>=1.70.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ragas>=0.2.0,<1.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
