# @author: caoshuai.cs
# @date: 2026-07-12
# @description: LabAgent 一键编排：PostgreSQL(pgvector) + Redis + MinIO + 后端 + ARQ Worker
services:
  postgres:
    image: ankane/pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-labagent}
      REDIS_URL: redis://redis:6379/0
      ARQ_QUEUE_NAME: ${ARQ_QUEUE_NAME:-kb_upload}
      ARQ_JOB_TIMEOUT_SECONDS: ${ARQ_JOB_TIMEOUT_SECONDS:-1800}
      ARQ_MAX_JOBS: ${ARQ_MAX_JOBS:-2}
      TOOL_WORKSPACE_ROOT: /data/tool-workspaces
      MEMORY_ROOT: /data/memory
      TOOL_RUNNER_BASE_URL: http://tool-runner:8990
      TOOL_RUNNER_TOKEN: ${TOOL_RUNNER_TOKEN:-}
    volumes:
      - tool_workspaces:/data/tool-workspaces
      - user_memories:/data/memory
    networks:
      - default
      - tool_internal
    ports:
      - "8989:8989"

  kb-worker:
    build:
      context: ./backend
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    command: ["/app/.venv/bin/arq", "app.workers.kb_upload_worker.WorkerSettings"]
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-labagent}
      REDIS_URL: redis://redis:6379/0
      ARQ_QUEUE_NAME: ${ARQ_QUEUE_NAME:-kb_upload}
      ARQ_JOB_TIMEOUT_SECONDS: ${ARQ_JOB_TIMEOUT_SECONDS:-1800}
      ARQ_MAX_JOBS: ${ARQ_MAX_JOBS:-2}
    restart: unless-stopped

  tool-runner:
    build:
      context: ./backend
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    command: ["/app/.venv/bin/uvicorn", "tool_runner.app:app", "--host", "0.0.0.0", "--port", "8990"]
    environment:
      TOOL_WORKSPACE_ROOT: /data/tool-workspaces
      TOOL_RUNNER_TOKEN: ${TOOL_RUNNER_TOKEN:-}
    volumes:
      - tool_workspaces:/data/tool-workspaces
    networks:
      - tool_internal
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pg_data:
  redis_data:
  minio_data:
  tool_workspaces:
  user_memories:

networks:
  tool_internal:
    internal: true
